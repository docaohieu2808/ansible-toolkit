# =============================================================================
# Playbook: Deploy Docker
# =============================================================================
# Install Docker CE (+ buildx and compose plugins) on target servers using the
# docker role: signed-by apt repository, daemon.json, docker group, traefik network.
# Usage: ansible-playbook -i inventory/production.yml playbooks/deploy-docker.yml
# =============================================================================

---
- name: Deploy Docker
  hosts: docker_hosts
  become: true
  gather_facts: true

  roles:
    - role: docker
      tags: [docker]

  post_tasks:
    - name: Verify Docker installation
      ansible.builtin.command: docker --version
      register: docker_version_output
      changed_when: false

    - name: Verify Docker Compose installation
      ansible.builtin.command: docker compose version
      register: compose_version_output
      changed_when: false

    - name: Display Docker versions
      ansible.builtin.debug:
        msg:
          - "{{ docker_version_output.stdout }}"
          - "{{ compose_version_output.stdout }}"
