# =============================================================================
# Playbook: Monitoring Setup - node_exporter + Grafana Alloy
# =============================================================================
# Usage:
#   ansible-playbook -i inventory/production.yml playbooks/monitoring-setup.yml \
#     --extra-vars "alloy_loki_url=http://loki.internal:3100/loki/api/v1/push"
# =============================================================================

---
- name: Setup Monitoring Stack (node_exporter + Grafana Alloy)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Display monitoring setup target
      ansible.builtin.debug:
        msg: "Installing monitoring agents on {{ inventory_hostname }} ({{ ansible_host }})"

  roles:
    - role: monitoring
      tags: [monitoring, node_exporter, alloy]

  post_tasks:
    - name: Verify node_exporter is responding
      ansible.builtin.uri:
        url: "http://localhost:{{ node_exporter_port | default(9100) }}/metrics"
        timeout: 10
      register: ne_check
      retries: 5
      delay: 3
      until: ne_check.status == 200
      changed_when: false

    - name: Verify Alloy is ready
      ansible.builtin.uri:
        url: "http://{{ alloy_listen_address | default('127.0.0.1') }}:{{ alloy_port | default(12345) }}/-/ready"
        timeout: 10
      register: alloy_check
      retries: 5
      delay: 3
      until: alloy_check.status == 200
      changed_when: false

    - name: Display monitoring status
      ansible.builtin.debug:
        msg:
          - "node_exporter: http://{{ ansible_host }}:{{ node_exporter_port | default(9100) }}/metrics"
          - "alloy: http://{{ alloy_listen_address | default('127.0.0.1') }}:{{ alloy_port | default(12345) }}/-/ready (reachable on the host only)"
