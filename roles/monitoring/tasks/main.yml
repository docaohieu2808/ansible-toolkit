# =============================================================================
# Role: Monitoring - Tasks (node_exporter + Grafana Alloy)
# =============================================================================

---
# Map ansible_architecture to the go/release arch string used by upstream tarballs
- name: Set architecture map fact
  ansible.builtin.set_fact:
    _arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armv7'}[ansible_architecture] | default('amd64') }}"

# ---------------------------------------------------------------------------
# Node Exporter
# ---------------------------------------------------------------------------
- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create node_exporter textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_user }}"
    mode: "0755"

- name: Download node_exporter binary
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ _arch }}.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}-{{ _arch }}.tar.gz"
    checksum: "sha256:https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/sha256sums.txt"
    mode: "0644"

- name: Extract node_exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}-{{ _arch }}.tar.gz"
    dest: /tmp/
    remote_src: true

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ _arch }}/node_exporter"
    dest: "{{ node_exporter_install_dir }}/node_exporter"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart node_exporter

- name: Deploy node_exporter systemd service
  ansible.builtin.template:
    src: node-exporter-systemd.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart node_exporter

- name: Ensure node_exporter is started and enabled
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

# ---------------------------------------------------------------------------
# Grafana Alloy
# ---------------------------------------------------------------------------
- name: Assert Alloy supports this architecture
  ansible.builtin.assert:
    that: _arch in ['amd64', 'arm64']
    fail_msg: "Grafana Alloy publishes linux binaries for amd64 and arm64 only (detected {{ ansible_architecture }})"
    quiet: true

- name: Install unzip (needed to unpack the Alloy release)
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: true

- name: Create alloy system user
  ansible.builtin.user:
    name: "{{ alloy_user }}"
    system: true
    shell: /usr/sbin/nologin
    groups: adm
    append: true
    create_home: false

- name: Create alloy config and storage directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ alloy_user }}"
    group: "{{ alloy_user }}"
    mode: "0755"
  loop:
    - "{{ alloy_config_dir }}"
    - "{{ alloy_storage_dir }}"

- name: Download Alloy release (checksum verified)
  ansible.builtin.get_url:
    url: "https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/alloy-linux-{{ _arch }}.zip"
    dest: "/tmp/alloy-{{ alloy_version }}-{{ _arch }}.zip"
    checksum: "sha256:https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/SHA256SUMS"
    mode: "0644"

- name: Create Alloy extraction directory
  ansible.builtin.file:
    path: "/tmp/alloy-{{ alloy_version }}-{{ _arch }}"
    state: directory
    mode: "0755"

- name: Extract Alloy binary
  ansible.builtin.unarchive:
    src: "/tmp/alloy-{{ alloy_version }}-{{ _arch }}.zip"
    dest: "/tmp/alloy-{{ alloy_version }}-{{ _arch }}/"
    remote_src: true
    creates: "/tmp/alloy-{{ alloy_version }}-{{ _arch }}/alloy-linux-{{ _arch }}"

- name: Install Alloy binary
  ansible.builtin.copy:
    src: "/tmp/alloy-{{ alloy_version }}-{{ _arch }}/alloy-linux-{{ _arch }}"
    dest: "{{ alloy_install_dir }}/alloy"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart alloy

- name: Deploy Alloy configuration
  ansible.builtin.template:
    src: alloy-config.alloy.j2
    dest: "{{ alloy_config_dir }}/config.alloy"
    owner: "{{ alloy_user }}"
    group: "{{ alloy_user }}"
    mode: "0640"
  notify: Restart alloy

- name: Deploy Alloy systemd service
  ansible.builtin.template:
    src: alloy-systemd.service.j2
    dest: /etc/systemd/system/alloy.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart alloy

- name: Ensure Alloy is started and enabled
  ansible.builtin.systemd:
    name: alloy
    state: started
    enabled: true
    daemon_reload: true
