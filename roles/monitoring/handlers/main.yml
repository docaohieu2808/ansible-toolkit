# =============================================================================
# Role: Monitoring - Handlers
# =============================================================================

---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: restarted

- name: Restart alloy
  ansible.builtin.systemd:
    name: alloy
    state: restarted
