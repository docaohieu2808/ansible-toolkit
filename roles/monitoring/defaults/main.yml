# =============================================================================
# Role: Monitoring - Default Variables
# =============================================================================

---
# Node Exporter
node_exporter_version: "1.12.1"
node_exporter_port: 9100
node_exporter_user: node_exporter
node_exporter_install_dir: /usr/local/bin
node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector
node_exporter_enabled_collectors:
  - systemd
  - processes
  - filesystem
node_exporter_disabled_collectors: []

# Grafana Alloy (replaces Promtail, which reached end of life in 03/2026).
# Release assets exist for amd64 and arm64 only. The role verifies the zip
# against the SHA256SUMS file published with the release.
alloy_version: "1.21.2"
alloy_install_dir: /usr/local/bin
alloy_config_dir: /etc/alloy
alloy_storage_dir: /var/lib/alloy
alloy_user: alloy
# Alloy UI / metrics / readiness endpoint. Bound to loopback by default.
alloy_listen_address: "127.0.0.1"
alloy_port: 12345

# Loki endpoint - set per environment
alloy_loki_url: "http://loki:3100/loki/api/v1/push"

# Log files to tail and ship to Loki. Same shape the old promtail_scrape_configs
# used: job_name is informational, path may contain globs, labels become Loki labels.
alloy_log_sources:
  - job_name: syslog
    path: /var/log/syslog
    labels:
      job: syslog
      host: "{{ inventory_hostname }}"
  - job_name: auth
    path: /var/log/auth.log
    labels:
      job: auth
      host: "{{ inventory_hostname }}"
  - job_name: docker
    path: /var/lib/docker/containers/*/*-json.log
    labels:
      job: docker
      host: "{{ inventory_hostname }}"
