---
- name: Verify backup role
  hosts: all
  gather_facts: true
  become: true

  vars_files:
    - ../../defaults/main.yml

  tasks:
    - name: Restic is installed at the pinned version
      ansible.builtin.command: restic version
      register: restic_ver
      changed_when: false
      failed_when: "'restic ' ~ restic_version not in restic_ver.stdout"

    - name: Credentials file is root-only
      ansible.builtin.stat:
        path: /etc/restic/env
      register: env_file
      failed_when: env_file.stat.mode != '0600' or env_file.stat.pw_name != 'root'

    - name: Timer is enabled and active
      ansible.builtin.command: "systemctl {{ item }} restic-backup.timer"
      loop: [is-enabled, is-active]
      changed_when: false

    - name: Run the installed backup script (the same file the systemd service runs)
      ansible.builtin.command: /usr/local/bin/restic-backup
      changed_when: true

    - name: List snapshots
      ansible.builtin.shell: |
        set -a; . /etc/restic/env; set +a
        restic snapshots --json
      args:
        executable: /bin/bash
      register: snapshots
      changed_when: false

    - name: Assert one snapshot of the source directory with the ansible tag
      ansible.builtin.assert:
        that:
          - (snapshots.stdout | from_json) | length == 1
          - (snapshots.stdout | from_json)[0].paths == ['/srv/backup-source']
          - "'ansible' in (snapshots.stdout | from_json)[0].tags"

    - name: List files in the latest snapshot
      ansible.builtin.shell: |
        set -a; . /etc/restic/env; set +a
        restic ls latest
      args:
        executable: /bin/bash
      register: snapshot_files
      changed_when: false

    - name: Assert the included file is backed up and the excluded one is not
      ansible.builtin.assert:
        that:
          - "'/srv/backup-source/keep.txt' in snapshot_files.stdout"
          - "'skip.tmp' not in snapshot_files.stdout"

    - name: Restore the snapshot and compare content
      ansible.builtin.shell: |
        set -a; . /etc/restic/env; set +a
        restic restore latest --target /tmp/restore-check
        cat /tmp/restore-check/srv/backup-source/keep.txt
      args:
        executable: /bin/bash
      register: restored
      changed_when: false
      failed_when: restored.stdout_lines[-1] != 'important data'
